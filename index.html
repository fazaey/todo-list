<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List App</title>
    <link rel="stylesheet" href="/index.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="left-side">
                <h1>To Do List</h1>
            </div>
            <div class="right-side">
                <div class="profile-info">
                    <h3>Fakhruz Zaini</h3>
                    <p>Software Engineer</p>
                </div>
            </div>
        </nav>
    </header>
   <main>
    <div class="wrapper">
        <h1>Things To Do</h1>
        <form id="todo-form">
            <input type="text" name="input-task" id="input-task" placeholder="Masukkan tugas di sini!" required>
            <select name="priority" id="priority">
                <option value="" disabled selected>Pilih tingkat prioritas penyelesaian tugas</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
            <button type="submit" id="add-btn">Tambah</button>
        </form>
        <section id="task-section">
            <h2>Dalam Proses Pengerjaan</h2>
            <ul id="task-list"></ul>
        </section>
        <button id="delete-all-btn">
            Hapus Semua Tugas
        </button>
        <section id="done-section">
            <h2>Sudah Selesai</h2>
            <ul id="done-task"></ul>
        </section>
    </div>
   </main> 
   <script src="/main.js"></script>
</body>
</html>
